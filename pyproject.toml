[project]
name = "forecast-tiles"
version = "0.1.0"
description = "Precomputed global forecast tiles for Passage: NOAA/Copernicus ingestion, PFT1 tiling, Cloudflare R2 publishing"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0",
    "eccodes>=2.38",
    "requests>=2.32",
    "orjson>=3.10",
    "ecmwf-opendata>=0.3.19",
    "eccodeslib>=2.47.3.22",
    "boto3>=1.34",
]

[project.scripts]
ingest = "ingest.cli:main"

[project.optional-dependencies]
currents = [
    "copernicusmarine>=2.0",
]
# Open-Meteo bulk files (docs/open-meteo-bulk-implementation-plan.md): the
# plain local reader only. omfiles is GPL-2.0-only and stays an optional extra;
# its fsspec/s3fs extras are not used (their botocore pins would bind the
# lockfile every workflow shares).
openmeteo = [
    "omfiles==1.2.0",
    "pyproj==3.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilekit", "src/landkit", "src/ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
