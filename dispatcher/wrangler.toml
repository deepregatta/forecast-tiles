# The forecast-tiles dispatcher: starts each ingest workflow at its
# provider's usual publication time (README.md → Dispatcher). Cron Triggers
# only: no fetch handler, no routes, no workers.dev URL.
name = "forecast-tiles-dispatcher"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[triggers]
# UTC. These five expressions are all 5 Cron Triggers of the Workers Free
# plan; src/timetable.ts decides which layer each fire time dispatches, and
# test/wrangler.test.ts keeps the two in step. If the account needs a
# trigger elsewhere, redesign missed-slot monitoring before changing to */5.
crons = [
  "25 3,4,9,10,15,16,21,22 * * *", # weather (GFS); ICON-EU (disabled by default)
  "0 5,11,17,23 * * *",  # waves (GFS-Wave)
  "15 0,1,4,6,10,12,13,16,18,22 * * *",  # GEFS, ECMWF-short; AROME 09/21Z; UKV
  "20 7,19 * * *",       # weather-ecmwf (00Z and 12Z)
  "45 5,9,18 * * *",     # currents; AROME 03/15Z (05:45 dispatches both)
]

[vars]
# "false" dispatches (live since Phase 5B, 2026-10-01). Anything else logs
# "would dispatch …" lines instead of starting workflows. The GITHUB_TOKEN
# secret is set with `npx wrangler secret put GITHUB_TOKEN`, never here.
DRY_RUN = "false"
REGIONAL_MODELS = "" # Maintainer enables individual models only after consumer/capacity gates.
REGIONAL_FULL_CADENCE = "false" # Keep two cycles/day until the seven-day canary passes.

[observability]
enabled = true
