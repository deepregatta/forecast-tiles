name: ingest-ensemble
run-name: ingest-ensemble ${{ inputs.cycle || 'scheduled' }}

on:
  schedule:
    - cron: "0 4 * * *" # daily, ~4 h after the 00Z GEFS cycle
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle YYYYMMDDTHH (default: latest complete)"
        required: false
      wait_minutes:
        description: "With a cycle: wait up to N minutes for the provider to publish it, then fail (the dispatcher sets this)"
        required: false
        default: "0"
      allow_member_drift:
        description: "Proceed even when member count != 31"
        type: boolean
        default: false
      force:
        description: "Publish even if latest.json already has this cycle (repairs only: run ids are cached forever)"
        type: boolean
        default: false

concurrency:
  group: ingest-ensemble
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # a dispatcher wait (90-180 min) plus the job, under the 6 h job limit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync
      - run: >
          uv run ingest ensemble ${CYCLE:+--cycle "$CYCLE"} ${CYCLE:+--wait-minutes "${WAIT:-0}"}
          ${DRIFT:+--allow-member-drift} ${FORCE:+--force}
        env:
          CYCLE: ${{ inputs.cycle }}
          WAIT: ${{ inputs.wait_minutes }}
          PYTHONUNBUFFERED: "1" # log lines carry the time they happened
          DRIFT: ${{ inputs.allow_member_drift == true && '1' || '' }}
          FORCE: ${{ inputs.force == true && '1' || '' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
