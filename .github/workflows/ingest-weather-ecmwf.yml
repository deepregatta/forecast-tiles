name: ingest-weather-ecmwf
run-name: ingest-weather-ecmwf ${{ inputs.cycle || 'scheduled' }}

on:
  schedule:
    - cron: "15 5 * * *" # daily, after the 00Z ECMWF open data publish
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle YYYYMMDDTHH (default: latest full-horizon cycle)"
        required: false
      wait_minutes:
        description: "With a cycle: wait up to N minutes for the provider to publish it, then fail (the dispatcher sets this)"
        required: false
        default: "0"
      force:
        description: "Publish even if latest.json already has this cycle (repairs only: run ids are cached forever)"
        type: boolean
        default: false

concurrency:
  group: ingest-weather-ecmwf
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # a dispatcher wait (90-180 min) plus the job, under the 6 h job limit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync
      # exits 0 with a log line when the cycle is not published yet (exit 1
      # instead when a dispatched wait_minutes runs out)
      - run: uv run ingest weather-ecmwf ${CYCLE:+--cycle "$CYCLE"} ${CYCLE:+--wait-minutes "${WAIT:-0}"} ${FORCE:+--force}
        env:
          CYCLE: ${{ inputs.cycle }}
          WAIT: ${{ inputs.wait_minutes }}
          FORCE: ${{ inputs.force == true && '1' || '' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
