name: land-index

# No schedule, on purpose. The routing index is a one-shot artifact: shorelines
# and bathymetry change on the timescale of survey programmes, not forecast
# cycles. It is rebuilt when a source publishes a new release, when the domain
# is extended, or when a conservatism parameter is deliberately changed — and
# every rebuild ships as a new immutable version.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Routing domain to compile"
        required: false
        default: "nweu"
      dry_run:
        description: "Compile and check without publishing to R2"
        type: boolean
        required: false
        default: false

concurrency:
  group: land-index
  cancel-in-progress: false

permissions:
  contents: read

# Enable only after the reviewed R2 control document has been provisioned.
env:
  CAPACITY_ENFORCE: ${{ vars.CAPACITY_ENFORCE || '0' }}
  PAID_WORK_ENFORCE: ${{ vars.PAID_WORK_ENFORCE || '0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # One DTM block per degree square, fetched from a public WCS at its native
    # posting. A cold cache for the nweu domain is a few hundred requests.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'
      - run: uv sync
      - name: Compile and publish the routing index
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            uv run ingest land --domain "${DOMAIN:-nweu}" --dry-run "${RUNNER_TEMP}/land-index"
          else
            uv run ingest land --domain "${DOMAIN:-nweu}"
          fi
        env:
          DOMAIN: ${{ inputs.domain }}
          DRY_RUN: ${{ inputs.dry_run }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MAX_BUCKET_BYTES: ${{ vars.MAX_BUCKET_BYTES || '14000000000' }}
