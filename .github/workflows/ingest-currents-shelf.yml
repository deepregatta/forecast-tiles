name: ingest-currents-shelf
run-name: ingest-currents-shelf ${{ inputs.layer }} ${{ inputs.cycle || 'latest' }}${{ inputs.dry_run && ' (dry run)' || '' }}

# STAGED (docs/shelf-currents.md): the Copernicus NW Shelf and Mediterranean
# current layers. Manual dispatch only: no schedule, no dispatcher entry, and
# no bucket credentials in this file. A run without dry_run reaches the CLI's
# staged-layer gate and exits 1; publication needs the owner's approval and
# the steps in docs/shelf-currents.md -> "To publish".
on:
  workflow_dispatch:
    inputs:
      layer:
        description: "Layer to build"
        type: choice
        options:
          - currents-nws
          - currents-med
        default: currents-nws
      cycle:
        description: "Cycle YYYYMMDDTHH (default: latest complete daily bulletin)"
        required: false
      dry_run:
        description: "Build into the runner's scratch directory only (no bucket)"
        type: boolean
        default: true

concurrency:
  group: ingest-currents-shelf-${{ inputs.layer }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'
      - run: uv sync --extra currents
      - run: uv run ingest "$LAYER" ${CYCLE:+--cycle "$CYCLE"} ${DRY_RUN:+--dry-run "$RUNNER_TEMP/tiles"}
        env:
          LAYER: ${{ inputs.layer }}
          CYCLE: ${{ inputs.cycle }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          PYTHONUNBUFFERED: "1"
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          COPERNICUSMARINE_HTTPS_TIMEOUT: "20"
          COPERNICUSMARINE_HTTPS_RETRIES: "2"
