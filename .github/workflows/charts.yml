name: charts

# TCP1 chart archives (docs/chart-pack-format.md): the world overview and one
# z6 cell per matrix job, then one publish job, the only one holding the R2
# secrets. No GitHub schedule: the monthly run (the owner's cadence since
# 2026-11-07; Open Waters told of the monthly range reads the same day) is
# dispatched by the Cloudflare dispatcher with `newest` for both dates, which
# the plan job resolves. Each build job reads the published pointer: a target
# whose inputs are the published archive's is not built, and a cell reads its
# EMODnet product back instead of the DTM (src/ingest/charts/products.py).
on:
  workflow_dispatch:
    inputs:
      seamap:
        description: "Open Waters Seamap archive date, YYYY-MM-DD, or newest"
        required: true
      protomaps:
        description: "Protomaps daily build, YYYYMMDD, or newest"
        required: true
      cells:
        description: "Cell set (europe, stage1) or cell ids, comma-separated"
        required: false
        default: "europe"
      dry_run:
        description: "Build and publish to a scratch layout, not R2"
        type: boolean
        required: false
        default: true

concurrency:
  group: charts
  cancel-in-progress: false

permissions:
  contents: read

env:
  CAPACITY_ENFORCE: ${{ vars.CAPACITY_ENFORCE || '0' }}
  PAID_WORK_ENFORCE: ${{ vars.PAID_WORK_ENFORCE || '0' }}
  # public, read without credentials: what the next build is compared with
  PUBLISHED: https://forecast.deepregatta.com/charts/latest.json

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_id: ${{ steps.plan.outputs.build_id }}
      matrix: ${{ steps.plan.outputs.matrix }}
      seamap: ${{ steps.plan.outputs.seamap }}
      protomaps: ${{ steps.plan.outputs.protomaps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'
      - run: uv sync --extra charts
      - id: plan
        run: >-
          uv run ingest-charts plan --cells "${CELLS:-europe}" --seamap "$SEAMAP"
          --protomaps "$PROTOMAPS" --previous "$PUBLISHED" | tee -a "$GITHUB_OUTPUT"
        env:
          CELLS: ${{ inputs.cells }}
          SEAMAP: ${{ inputs.seamap }}
          PROTOMAPS: ${{ inputs.protomaps }}

  build:
    needs: plan
    runs-on: ubuntu-latest
    # A cell reads a few hundred MB of tile ranges; one without a published
    # EMODnet product also reads up to about 40 DTM blocks (about 21 s each).
    timeout-minutes: 150
    strategy:
      fail-fast: true
      # Gentle on Open Waters' and Protomaps' servers: a few cells at a time.
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DEEPREGATTA_LAND_CACHE: ${{ github.workspace }}/.land-cache
      DEEPREGATTA_CHARTS_CACHE: ${{ github.workspace }}/.charts-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'
      - run: uv sync --extra charts
      # No GitHub cache: what EMODnet decides for a cell is published with it
      # (its EMODnet product) and read back until the DTM's next release.
      - name: Build ${{ matrix.target }}
        run: >-
          uv run ingest-charts build "$TARGET" --build-id "$BUILD_ID"
          --protomaps "$PROTOMAPS" --seamap "$SEAMAP" --workers 4
          --previous "$PUBLISHED" --out "$RUNNER_TEMP/charts"
        env:
          TARGET: ${{ matrix.target }}
          BUILD_ID: ${{ needs.plan.outputs.build_id }}
          PROTOMAPS: ${{ needs.plan.outputs.protomaps }}
          SEAMAP: ${{ needs.plan.outputs.seamap }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charts-${{ matrix.target }}
          path: ${{ runner.temp }}/charts/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'
      - run: uv sync --extra charts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: charts-*
          merge-multiple: true
          path: ${{ runner.temp }}/charts
      - name: Publish to a scratch layout (dry run)
        if: inputs.dry_run
        run: >-
          uv run ingest-charts publish --build-dir "$RUNNER_TEMP/charts"
          --build-id "$BUILD_ID" --dry-run "$RUNNER_TEMP/charts-r2"
        env:
          BUILD_ID: ${{ needs.plan.outputs.build_id }}
      - name: Publish to R2
        if: ${{ !inputs.dry_run }}
        run: uv run ingest-charts publish --build-dir "$RUNNER_TEMP/charts" --build-id "$BUILD_ID"
        env:
          BUILD_ID: ${{ needs.plan.outputs.build_id }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MAX_BUCKET_BYTES: ${{ vars.MAX_BUCKET_BYTES || '20000000000' }}
          REGIONAL_EXISTING_PEAK_BYTES: ${{ vars.REGIONAL_EXISTING_PEAK_BYTES }}
          REGIONAL_HEADROOM_BYTES: ${{ vars.REGIONAL_HEADROOM_BYTES }}
          REGIONAL_ENABLED_LAYERS: ${{ vars.OPENMETEO_ENABLED_LAYERS }}
